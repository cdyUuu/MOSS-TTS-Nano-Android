name: Build and Release Android APK

permissions:
  contents: write

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode keystore from Secrets
      run: |
        if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore
          echo "Keystore decoded from Secrets"
        else
          echo "No keystore secret found, using local keystore if exists"
        fi

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Build Release APK
      run: ./gradlew assembleRelease --no-daemon

    - name: Upload Debug APK (arm64-v8a)
      uses: actions/upload-artifact@v4
      with:
        name: debug-arm64-v8a
        path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
        retention-days: 30

    - name: Upload Debug APK (universal)
      uses: actions/upload-artifact@v4
      with:
        name: debug-universal
        path: app/build/outputs/apk/debug/app-universal-debug.apk
        retention-days: 30

    - name: Upload Release APK (arm64-v8a)
      uses: actions/upload-artifact@v4
      with:
        name: release-arm64-v8a
        path: app/build/outputs/apk/release/app-arm64-v8a-release.apk
        retention-days: 30

    - name: Upload Release APK (universal)
      uses: actions/upload-artifact@v4
      with:
        name: release-universal
        path: app/build/outputs/apk/release/app-universal-release.apk
        retention-days: 30

    - name: Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        name: Release ${{ github.ref_name }}
        generate_release_notes: true
        files: |
          app/build/outputs/apk/release/app-arm64-v8a-release.apk
          app/build/outputs/apk/release/app-universal-release.apk
          app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          app/build/outputs/apk/debug/app-universal-debug.apk
